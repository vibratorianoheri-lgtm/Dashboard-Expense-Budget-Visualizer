<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
        <header>
            <h1>Pengeluaran & Anggaran</h1>
            <div class="balance-container">
                <p>Total Pengeluaran</p>
                <h2 id="total-balance">Rp 0</h2>
            </div>
        </header>

        <main>
            <!-- Input Form -->
            <section class="form-section">
                <form id="expense-form">
                    <div class="form-group">
                        <input type="text" id="item-name" placeholder="Nama Item" required>
                    </div>
                    <div class="form-group">
                        <input type="number" id="item-amount" placeholder="Nominal (Rp)" required min="1">
                    </div>
                    <div class="form-group">
                        <select id="item-category" required>
                            <option value="" disabled selected>Pilih Kategori</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Fun">Fun</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">Tambah Transaksi</button>
                </form>
            </section>

            <!-- Visual Chart -->
            <section class="chart-section">
                <canvas id="expense-chart"></canvas>
            </section>

            <!-- Transaction List -->
            <section class="list-section">
                <h3>Riwayat Transaksi</h3>
                <ul id="transaction-list" class="scrollable-list">
                    <!-- Item akan ditambahkan melalui JavaScript -->
                </ul>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
